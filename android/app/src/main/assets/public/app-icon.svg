<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base Rounded Container (Adaptive Icon ready) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle Border Inner Glow -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-opacity="0.25" />

  <!-- Document / Bill Silhouette -->
  <g filter="url(#shadow)">
    <!-- Main Invoice Card -->
    <rect x="116" y="86" width="280" height="340" rx="24" fill="#ffffff" />
    
    <!-- Top Accent Bar -->
    <path d="M 116 110 C 116 96.7 126.7 86 140 86 L 372 86 C 385.3 86 396 96.7 396 110 L 396 150 L 116 150 Z" fill="url(#accentGrad)" />

    <!-- Indian Rupee Symbol & Bill Lines -->
    <!-- Rupee Icon Circle -->
    <circle cx="170" cy="118" r="18" fill="#ffffff" />
    <text x="170" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#0f766e" text-anchor="middle">₹</text>

    <!-- App Title on Header -->
    <text x="202" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#ffffff" letter-spacing="1">GST PRO</text>

    <!-- Invoice Mock Rows -->
    <rect x="146" y="174" width="140" height="12" rx="6" fill="#0f766e" fill-opacity="0.85" />
    <rect x="316" y="174" width="50" height="12" rx="6" fill="#0f766e" fill-opacity="0.5" />

    <rect x="146" y="202" width="100" height="10" rx="5" fill="#94a3b8" />
    <rect x="326" y="202" width="40" height="10" rx="5" fill="#94a3b8" />

    <rect x="146" y="226" width="120" height="10" rx="5" fill="#cbd5e1" />
    <rect x="326" y="226" width="40" height="10" rx="5" fill="#cbd5e1" />

    <rect x="146" y="250" width="90" height="10" rx="5" fill="#cbd5e1" />
    <rect x="326" y="250" width="40" height="10" rx="5" fill="#cbd5e1" />

    <!-- Divider Line -->
    <line x1="146" y1="280" x2="366" y2="280" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4 4" />

    <!-- Total Badge Box -->
    <rect x="146" y="300" width="220" height="42" rx="10" fill="#f0fdfa" stroke="#ccfbf1" stroke-width="1.5" />
    <text x="160" y="326" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0f766e">TOTAL PAID</text>
    <text x="352" y="327" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#0f766e" text-anchor="end">₹ 14,850</text>

    <!-- Verified GST Badge -->
    <g transform="translate(256, 375)">
      <rect x="-80" y="-14" width="160" height="28" rx="14" fill="#0f766e" />
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">100% OFFLINE</text>
    </g>
  </g>
</svg>
