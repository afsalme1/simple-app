<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>GST Invoice Pro - Offline Indian GST Billing Suite</title>
    <meta name="description" content="Fully offline GST billing mobile & desktop application for India with gapless FY numbering, CGST/SGST/IGST tax engine, Bill of Supply, Estimate billing, profit analytics, A4 & thermal POS printing, and backup." />
    <meta property="og:title" content="GST Invoice Pro - Offline Indian GST Billing Suite" />
    <meta property="og:description" content="Fully offline GST billing mobile & desktop application with gapless FY numbering, CGST/SGST/IGST tax engine, and instant PDF/Thermal printing." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Android PWA & Mobile Web App Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GST Invoice Pro" />
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
    <link rel="apple-touch-icon" href="/app-icon.svg" />
  </head>
  <body class="bg-slate-100 text-slate-800 antialiased select-none-touch overscroll-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('SW registration error:', err);
          });
        });
      }
    </script>
  </body>
</html>
